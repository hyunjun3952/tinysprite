# Install once per clone: `pre-commit install`. CI runs the same hooks
# with `pre-commit run --all-files --hook-stage manual`. The clang tools are pinned here, once.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        name: clang-format
        types_or: [c++]
        files: ^(src|include|tests)/
        args: [--Werror]
        stages: [pre-commit, manual]

  # Needs build/compile_commands.json: `cmake -S . -B build`. On push it checks the files being
  # pushed; src/ui and tests/ui are in the database only when the UI is built (libsdl2-dev).
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy -p build --quiet
        language: python
        additional_dependencies: [clang-tidy==18.1.8]
        files: ^(src|tests)/.*\.cpp$
        stages: [pre-push, manual]
