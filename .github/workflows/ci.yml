name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Linux: format, lint, ASan/UBSan build and tests (UI included).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: scripts/install-deps.sh
      - name: Shellcheck
        run: shellcheck scripts/*.sh .githooks/pre-commit .githooks/pre-push
      - name: Format check
        run: scripts/format.sh --check
      - name: Configure
        run: cmake -S . -B build -DTINYSPRITE_BUILD_UI=ON
      - name: Lint
        run: scripts/lint.sh build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
      # MinGW has no ASan/UBSan, so sanitizers are off here (the Linux job runs them).
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTINYSPRITE_SANITIZE=OFF -DTINYSPRITE_BUILD_UI=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: tinysprite-windows
          path: |
            build/src/ui/tinysprite.exe
            build/src/ui/SDL2.dll
