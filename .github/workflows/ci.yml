name: ci

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/actions/**'
      - '.pre-commit-config.yaml'
      - '.clang-format'
      - '.clang-tidy'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/actions/**'
      - '.pre-commit-config.yaml'
      - '.clang-format'
      - '.clang-tidy'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: autoconf autoconf-archive automake libtool libltdl-dev libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev
          version: 1
      - uses: ./.github/actions/vcpkg
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Configure
        run: >-
          cmake -S . -B build -DTINYSPRITE_BUILD_UI=ON -DTINYSPRITE_WERROR=ON
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
      # clang-tidy costs ~7 s per file, so a push or PR lints only the files it changed. Everything is linted
      # on the weekly schedule, by hand, and when a header or a lint config changed (a header can affect
      # files that were not touched).
      - name: Format and lint
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          full=--all-files
          if [ "${{ github.event_name }}" = push ] || [ "${{ github.event_name }}" = pull_request ]; then
            if [ -n "$BASE" ] && ! echo "$BASE" | grep -q '^0*$' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -Eq '\.(h|hpp)$|^CMakeLists\.txt$|^\.clang-(tidy|format)$|^\.pre-commit-config\.yaml$'; then
                echo "header or lint config changed: linting everything"
              else
                full="--from-ref $BASE --to-ref $GITHUB_SHA"
              fi
            fi
          fi
          pipx run pre-commit run $full --hook-stage manual --show-diff-on-failure

  linux:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ccache autoconf autoconf-archive automake libtool libltdl-dev libx11-dev libxft-dev libxext-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev
          version: 1
      - uses: ./.github/actions/vcpkg
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: linux-${{ github.sha }}
          restore-keys: linux-
      - name: Configure
        run: >-
          cmake -S . -B build -DTINYSPRITE_BUILD_UI=ON -DTINYSPRITE_WERROR=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  windows:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/vcpkg
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
      # MinGW has no ASan/UBSan; the Linux job runs them. vcpkg builds the libraries static (x64-mingw-static),
      # so there is no DLL to ship.
      - name: Configure
        shell: msys2 {0}
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTINYSPRITE_SANITIZE=OFF -DTINYSPRITE_BUILD_UI=ON
          -DCMAKE_TOOLCHAIN_FILE="$(cygpath -m "$VCPKG_ROOT")/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-mingw-static -DVCPKG_HOST_TRIPLET=x64-mingw-static
      - name: Build
        shell: msys2 {0}
        run: cmake --build build
      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
